# Formatting and lint config only. Deliberately NOT the root pyproject.toml that
# Isaac Lab's template generator emits: that file declares `name = "isaaclab-dev"`
# and a [tool.uv.sources] table pointing at source/isaaclab, source/isaaclab_rl and
# friends — paths that exist in the Isaac Lab repo, not in an external project.
# The ruff settings below are kept so our code formats the way Isaac Lab's does.
#
# The installable package lives in source/insertion (see its own setup.py).

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["logs", "reference/factory_source", ".vscode", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "SIM", "RET"]
ignore = ["E402", "RET504", "RET505", "SIM102", "SIM108", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# Isaac Lab's own scripts group their imports as: third-party, then isaaclab,
# then isaaclab_tasks and the other extensions. That grouping says something
# real -- which of these need a running simulator -- so it is declared here
# rather than flattened away by the import sorter.
[tool.ruff.lint.isort]
known-first-party = ["harness", "insertion"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "isaaclab",
    "isaaclab-extensions",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
isaaclab = ["isaaclab"]
isaaclab-extensions = ["isaaclab_tasks", "isaaclab_assets", "isaaclab_rl", "isaaclab_mimic", "isaaclab_teleop"]

[tool.ruff.format]
docstring-code-format = true
