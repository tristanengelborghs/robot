params:
  seed: 42
  algo: {name: a2c_continuous}
  model: {name: continuous_a2c_logstd}
  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init: {name: default}
        sigma_init: {name: const_initializer, val: 0}
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      initializer: {name: default}
  load_checkpoint: False
  load_path: ''
  config:
    name: catch_shadow
    env_name: rlgpu
    device: cuda:0
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True          # time-limit truncations are not failures
    num_actors: -1
    reward_shaper: {scale_value: 0.01}
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 5e-4
    lr_schedule: adaptive
    kl_threshold: 0.016
    score_to_win: 100000
    max_epochs: 10000
    save_best_after: 100
    save_frequency: 200
    grad_norm: 1.0
    entropy_coef: 0.002
    truncate_grads: True
    e_clip: 0.2
    # 64 steps at 240 Hz is ~0.27 s, comfortably longer than the ~0.13 s fall
    # of an 8 cm drop, so a whole catch fits inside one horizon rather than
    # straddling two.
    horizon_length: 64
    minibatch_size: 16384
    mini_epochs: 5
    critic_coef: 4
    clip_value: True
    bounds_loss_coef: 0.0005
